databases:
  - name: gamememory-db
    databaseName: gamememory
    user: gamememory

services:
  - type: web
    name: gamememory-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn gamememory.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: gamememory-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://gamememory.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://gamememory.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: gamememory-db
          property: connectionString
      - key: RAWG_API_KEY
        sync: false
      - key: STEAMGRIDDB_API_KEY
        sync: false
